# 包装模板 A · 安全口播（pack-safe-talking）
#
# 「安全」指它能套在任何素材上都不出错，代价是不出彩：全部包装只有一套底部字幕带。
# 参数取自 19 支参考片里 5 支的实测交集，括号里是各片取值。
#
# 来源片：
#   创业者如何一年顶三年   字幕带 0.670–0.715H · 行高 4.6%H · 8–12 字 · 白字+黑描边 2–3px
#   被恒大坑的最惨的大佬   字幕 60–74%H · 6–8%H · 7–10 字 · 描边 2–3px
#   视频-AI自动剪          基线 85%H · 4–5%H · 8–13 字 · 投影 blur 4–6px
#   让ip能放松回答         80–95%H · 3.5–4%H · 13–14 字
#   口播动效包装教程       0.881–0.917H · 3.3%H · 11–14 字 · 无描边
#   如何才能让视频包装有高级感  基线 90%H · 3.9%H · 单行 · 黄字+黑描边(1/8 笔画)
#   孙建亚最新展厅RARA HOUSE  字形带 67.5–70.5%（中心 69）· 白字纯黑描边 · 无投影无底衬
#                            · 字卡/角标/logo/片头尾卡 全 0 · 少数亮帧才补半透明黑条

name: pack-safe-talking
label: 安全口播（单层字幕带）
family: A

canvas:
  aspect: [9:16, 16:9]        # 两向都有自己的实测样本，不做限定
  fps: [24, 30]

subtitle:
  font_class: sans_heavy      # 黑体/综艺粗黑；不要宋体（宋体属于模板 B）
  weight: bold
  # 字幕带中心（占画幅高比例）。实测跨度 0.67–0.92，取中位 0.86 起手
  band_center_h: 0.86
  band_center_h_range: [0.79, 0.92]
  glyph_h_ratio: 0.045        # 实测 0.033–0.06，取中位
  glyph_h_range: [0.033, 0.060]
  chars_per_line: [8, 13]     # 实测 7–14；>14 必断行，不许缩字号
  lines_per_screen: 1
  color: "#FFFFFF"
  # 描边与投影二选一，不许叠两层（实测：叠了的片看起来"糊"）
  stroke:
    px_at_720h: 2.5
    ratio_of_glyph: 0.125     # 高级感那片实测 ≈1/8 笔画
    color: "#000000"
  shadow:
    offset_h: 0.004
    blur_h: 0.01
    alpha: 0.75
  safe_bottom_h: 0.05         # 下沿距画幅底 ≥5%H；平台底栏会吃掉更低的字
  entry: hard_cut             # 整块硬上，不做入场动画

tempo:
  shot_median_s: [2.0, 4.8]   # 实测 2.2–4.8；<2 会显得吵，>6 会闷
  sfx_density_per_min: [0, 8.5]   # 实测 0–8.5，极差极大 → 见「音效铁律」

# A 族里有一支走的是反方向：包装置零，把画面全部让出来。
# 它和主线的差别只有三个数：字幕带更高（0.69 vs 0.86）、纯描边不投影、图形层全 0。
variant_yield_to_footage:
  band_center_h: 0.69
  glyph_h_ratio: 0.030
  stroke_only: true            # 无投影、无底衬；只有画面亮到看不清时才临时补一条半透明黑条
  graphics: []                 # 字卡 0 / 角标 0 / logo 卡 0 / 片头片尾卡 0
  saturation_kept: 0.325       # 不压饱和（和模板 B 的 0.20 上限正相反）
  use_when: 画面本身是主角（空间、材质、光），解说只负责托底

applies_to:
  - 单人坐姿口播、讲座、访谈精剪（机位几乎不动）
  - 素材本身构图干净、不需要靠图形层解释
  - 时长 40s–10min 都成立

fails_on:
  - 亮底素材 + 只用投影不用描边 → 白字直接消失（「读书」那片就是这么做的，只能在暗底成立）
  - 字幕带中心 <0.79H 且单条 >14 字 → 换行后压住画面主体
  - 主体偏上的竖屏素材：0.86 中心正好落在手上/桌面上
