# 风格包 #1 · 知识口播竖版（talking-head-v1）
# 参数来自对一条真实知识型口播片的逐帧反解（126.58s / 576x1024 / 24fps，
# 113 条字幕、38 个切点、7 处音效、零 BGM）。C 段实现时按这份参数执行，
# check_edl.py 里的节奏/字幕断言也以这里为准。
#
# 一个包的内部不许混：混出来的就是"拼贴感"。

name: talking-head-v1
label: 知识口播竖版
canvas:
  width: 1080
  height: 1920
  fps: 30

# 调色在切片阶段烤进素材（scripts/render_hf.py 的 GRADE 表）。
# 之前这条风格包没有调色，HDR 段压出来是灰的（luma 0.52 / 饱和 0.13），
# 加这条链之后 luma 0.374，参考片 0.381。
grade: warm_high_sat

subtitle:
  font: NotoSansSC-SemiBold         # 思源黑体 SemiBold。这行原来是 AlimamaShuHeiTi-Bold：
                                    # 标题美术字做字幕，小字号笔画带装饰就是脏点
                                    # （2026-11-08 Jerry 的原话是「字体不堪入目」）。
                                    # 必须给真字体文件，不能 local()
  size_px: 80                       # 72–84
  weight: ExtraBold
  color: "#FFFFFF"
  shadow: "0 3px 8px rgba(0,0,0,.75), 0 1px 2px rgba(0,0,0,.9)"
  stroke: "2px rgba(0,0,0,0.35)"     # 白字压在浅色食物/木纹镜头上会被吃掉（欧阳 b 片实测）

  center_y_px: 1294                 # 67.4% 高
  safe_bottom_px: 300               # 平台底栏，正文不许进
  max_chars_per_line: 10            # 单行 ≤10 展示单位（2026-11-12 收档，对齐 srt-motion-cards 规范）
  hold_min_s: 0.8                   # 每条 0.8–3.2s：再短抓不住，再长是这一格没剪好
  hold_max_s: 3.2
  density_per_min: [45, 58]         # 实测 50–56；低于 40 显拖
  entry: hard_cut                   # 硬切，不做入场动画
  colorize_emphasis: false          # 2026-11-09 Jerry：「字幕的重点词变色还是取消」。
                                    # 只染否定词和数字本来就窄，观众读到的是一次次的黄块，
                                    # 不是重点；要重就把重点交给大字那一层去做。

emphasis:
  font: NotoSansSC-Black            # 花字单独一层字体：放大到 10–16%H 才撑得住分量
  grammars: [big_keyword, strikethrough, quote]   # 只有三种
  keyword_color: "#F6EB34"          # 并列选项、转折词
  negation_color: "#C1121F"         # 否定结论
  big_keyword_px: [133, 304]        # 占画面高 10–16%（老口径，单排 FIT 之前）
  fit_width: 0.70                   # 大字单排、左右撑到画幅宽度的 70%，按字数缩放
                                    # （2026-11-09 Jerry：放大 2-3 倍 + 一排 + 适当缩放）
  top_h: 0.30                       # 大字顶边落在 0.30H：实测 0.44H 正压在画面主体上
  max_one_action_per_caption: true

shots:
  talking_median_s: 2.4             # 口播段；信息段 4–12
  max_single_shot_s: 12             # 超了要在 why 里写明刻意留白
  medium_change_within_s: 40        # 40s 内至少换一次介质

sfx:
  density_per_min: [3, 7]
  placement: on_cut_only            # 只打在切点
  tolerance_frames: 2
  bgm: none_or_very_low             # 无 BGM 或极轻垫音

audio:
  loudness_lufs: -14
  true_peak_dbtp: -1
  cut_fade_ms: 30
  duck_db: 12                       # 口播期间 BGM 让位

card:
  bottom_edge_max_px: 1080          # 卡片底边不超过这里，否则白字幕被浅色卡片吞掉
  mg_top_h: 0.21                    # MG 卡上沿

# MG（代码画的动效卡）—— 五子系统里原来缺的这一块。
# 光有大字等于把字幕放大一遍；数字、步骤、对比、行话得真的画出来。
# 选哪张看内容形态（references/mg-library.md），不看风格；这里只定「允许哪几种」与「长什么样」。
mg:
  library: [keyword-big, stat, steps, versus, term]
  rules:
    - 一批片子里同一个卡型不重复超过 2 次
    - 每条片至少一张内容专属卡：有数字用 stat，有对比用 versus，有流程用 steps
    - MG 卡不许压字幕带、不许压人脸；一屏只讲一件事
    - 卡上的话必须是台词里的原词

tokens:
  palette:
    ground: "#1A1410"
    ink: "#FFFFFF"
    accent: "#F6EB34"
    accent2: "#C1121F"
  # T-018：MG 底板/遮罩从渲染器搬到包里。这份是老样式包（golden 三支旧样片走的是它），
  # 必须逐字照旧写死的那几个值——旧片验收的数字一条都不许动。
  surface:
    plate: "rgba(10,13,19,.76)"
    plate_term: "rgba(12,15,21,.84)"
    border: "rgba(255,255,255,.16)"
    border_term: "rgba(255,255,255,.14)"
    scrim: "radial-gradient(76% 56% at 50% 42%, rgba(0,0,0,.90) 0%, rgba(0,0,0,.76) 46%, rgba(0,0,0,.38) 82%, rgba(0,0,0,.12) 100%)"
    ink: "#FFFFFF"
    blur_ness: 0
  type:
    display: NotoSansSC-Black
    body: NotoSansSC-SemiBold
  radius: 18
  stroke: 0
  shadow: soft-down
