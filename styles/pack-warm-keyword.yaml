# 包装模板 · 暖知识口播（pack-warm-keyword）
#
# 一支片的忠实复刻模板，不是族平均值。
#
# 来源片：创业者如何一年顶三年，苦练基本功（126.6s · 576×1024@24 · 14 镜 · 中位 4.8s）
#
# 为什么单独立一支：pack-safe-talking 是 7 支片取交集的"安全口播"，
# 字幕带落在 0.86H（最底那条线）。这一支落在 **0.69H**，字更小（0.032H 对手均 0.045H），
# 靠的不是"把字放低放粗"，是**花字上抬**——关键概念从字幕条抽出、放大近 2 倍、抬到画面中部。
# 拿族平均去做它，字会落在错的横线上、也永远没有那层黄字。
#
# 实测复核（2026-11-08，抽 16 帧量白字行）：
#   常驻字幕带 0.678–0.707H（中心 0.692）· 花字落在 0.45–0.65H
#   字体**黑体**（无衬线、横竖等粗、末端无三角）——之前那份逐支拆解写"宋体"是错的，已改
#   白字 + 黑硬描边（描边≈笔画 1/3–1/2，不是投影）
#   全片顶部 0–8% 完全空：不落标题、不落角标、不落 logo
#   饱和度 0.504（本批最高之一）· 主色 #7b5d3b 暖黄褐 · 静音 0.4%
#   21 个切点（机器）/ 14 个（人工复核）· 中位 1.9–4.8s

name: pack-warm-keyword
label: 暖知识口播（底部字幕 + 上抬花字）
family: A
variant: keyword_emphasis

canvas:
  aspect: [9:16]
  fps: [24, 30]

subtitle:
  font_class: sans_heavy
  weight: bold
  band_center_h: 0.692        # 实测 0.678–0.707
  band_center_h_range: [0.66, 0.72]
  glyph_h_ratio: 0.028        # 实测白字行高 0.0283（参考片现场量的），含描边约 0.031
  glyph_h_range: [0.026, 0.034]
  chars_per_line: [8, 12]     # 实测主体 8–12；长句可到 14 靠压字距，不折行
  lines_per_screen: 1
  color: "#FFFFFF"
  stroke:
    px_at_720h: 2.8           # 实测描边≈笔画 1/3–1/2
    color: "#000000"
  shadow: none                # 描边和投影二选一：这支是描边
  safe_bottom_h: 0.24         # 字幕带下面留 24% 呼吸——和 B 族同一个理由，但底色不压

# 花字：本模板的签名。从字幕条抽出、放大、上抬到画面中部，黄色，随口播重音出现。
emphasis:
  color: "#FFD400"            # 亮黄（比初版的 #F5D33A 更跳：并排看时初版发灰）
  glyph_h_ratio: 0.098        # 相对画面高。参考片那行大字实测 0.1006H（0.493–0.593）：
                              # 初版取 0.070 是量到了另一帧的小花字
  glyph_h_range: [0.088, 0.115]
  # 一行放不下才折两行，且不缩字号（见 render_film.render_cards）
  band_center_h: 0.52         # 实测花字落在 0.45–0.65H
  stroke:
    px_at_720h: 3.2
    color: "#000000"
  hold_s: [1.0, 1.5]
  entry: pop                  # 弹入 0.2–0.3s、带轻微过冲；离场直接消失
  max_chars: 6

palette:
  grade: warm_high_sat        # 暖黄褐 + 提饱和：实测饱和度 0.504
  saturation_target: [0.45, 0.52]
  temperature_k: 4800

tempo:
  shot_median_s: [1.8, 4.8]
  sfx_density_per_min: [4.0, 8.5]   # 实测 8.5/分，13/14 切点有瞬态

applies_to:
  - 单人坐姿口播、商业知识 / 方法论讲解、一次录制机位不动
  - 口播里**真有**关键概念值得被抽出来放大（没有就别用，"花字"会变成噪音）
  - 时长 60s–5min

fails_on:
  - 没有强调对象的叙事：花字抬起来全是形容词，观众只会觉得吵
  - 亮底 + 黄字：黄色在亮底上比白字更难读，必须配黑描边（模板里已经写好，别省）
  - 把花字当第二行字幕用：它的作用是"打断阅读节奏"，一句一句地念就失去意义
  - 顶部已经放了标题/角标的片子：这支的版式前提是顶部全空
