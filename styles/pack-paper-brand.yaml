# 包装模板 B · 纸感品牌（pack-paper-brand）
#
# 用字体族（宋体/明朝体）和字距把片子从「口播」推到「品牌片」的距离上去。
# 三个可测动作：换衬线体、用投影代替描边、把字幕带往上提给底部留白。
#
# 来源片：
#   家是用来享受的       宋体（横竖比 1:3、横画三角收笔）· 字形带 71.5–75.8%（中心 73）· 4.3%H · 右下偏移投影 · 字距偏松
#   人这一生有3次成长    标题 0.108–0.224H（0.058H/行）· #551313；字卡 #db716c @0.688–0.746H；说明行 0.039H
#   别只盯着赛道         中文 0.618–0.649H（0.031H 宋体）+ 英文衬线 0.666–0.679H（0.013H）
#   两者共同点：全片饱和度被压到 0.072–0.195，音效 0.0/分，靠长镜和留白撑

name: pack-paper-brand
label: 纸感品牌（宋体 + 投影 + 留白）
family: B

canvas:
  aspect: [9:16, 16:9]
  fps: [24, 30]

subtitle:
  font_class: serif           # 宋体/明朝体；横竖比约 1:3，横画末端三角收笔
  weight: regular_to_medium
  band_center_h: 0.70         # 实测 0.62–0.76；比模板 A 高 10–16 个百分点，专门给底部留白
  band_center_h_range: [0.62, 0.76]
  glyph_h_ratio: 0.037        # 实测 0.031–0.043
  glyph_h_range: [0.031, 0.043]
  chars_per_line: [5, 12]
  lines_per_screen: 1
  color: "#FFFFFF"
  stroke: none                # 关键：宋体描边会糊笔画，这里一律用投影
  shadow:
    offset: right_down
    color: "#000000"
  letter_spacing_em: [0.0, 0.02]   # 正常偏松；负字距会毁掉宋体的呼吸感
  safe_bottom_h: 0.24         # 实测下沿距底 24.2%H——底部是空的，这是本模板的签名

palette:
  saturation_cap: 0.20        # 实测 0.072–0.195；超了就不是这个家族
  grade: warm_low_sat         # 整体低饱和；不追求准确还原

chapter_card:
  number:
    style: hairline_sans      # 无衬线细等线大数字
    opacity: [0.20, 0.40]     # 半透明
    height_h: [0.18, 0.30]    # 数字叠压在标题后，占 18–30%H
  title:
    color: "#FFFFFF"
    shadow: black_soft

end_card:
  logo_h: [0.08, 0.13]
  body: vertical_left_aligned

tempo:
  shot_median_s: [8.5, 11.4]  # 实测 11.4（家）与 3.8（成长）；长镜是主流
  sfx_density_per_min: 0.0    # 三支来源片全是 0

applies_to:
  - 品牌/空间/质感类素材（家装、展厅、产品、面料）
  - 有大量静止细节可看的长镜头
  - 讲情绪、讲品味，不讲信息密度

fails_on:
  - 有色彩价值的素材（实拍红木、花艺、霓虹）会被 saturation_cap 压成灰片——这是这个家族的成立前提，不是缺陷
  - 需要信息推进的内容：11.4s 中位 + 零音效会像「卡住了」
  - 字号 <3%H 时宋体笔画开始粘连，字号红利消失
