# 包装模板 E · 图文界面叙事（pack-ui-narrative）
#
# 把抽象流程做成"看得见的界面"：纸片卡 / 对话窗 / 四象限 / 刻度轴 / 分屏版面 / 手绘标注。
# 这一族的包装不是贴在画面上的，而是**替观众搭一个能读的结构**。
#
# 来源片：
#   个人定制版-人生进化框架  纸片卡(胶带+红印章+手绘箭头) / AI对话窗 / 四象限(1.0·2.0 数字色块) / CTA 卡
#                            卡宽 80–88%W · 圆角 1.5–2%W · 停留 4–7s · 每镜中位 4.1s
#   买鞋自由，从加密鞋柜开始 白纸褶皱舞台 + 红色尺寸标注(80/37/96/0.4㎡) + 虚线对齐 · 片尾 01–06 手册页带页码 1/8
#   被恒大坑的最惨的大佬   章节标题区 0–15% / 人像窗 15–53% / B-roll 卡 53–93% / 品牌条 92–100%（分屏 3:7）
#   专访十亿女总裁         顶部刻度轴 5–10%H（4000→40万→300万→3亿→10亿）+ 圆形头像游标 + 圆形画中画

name: pack-ui-narrative
label: 图文界面叙事（卡片/分屏/标注/刻度）
family: E

canvas:
  aspect: [9:16, 16:9]
  fps: [24, 30]

card:
  width_w: [0.80, 0.90]
  radius_w: [0.015, 0.02]        # 小圆角，不做胶囊
  shadow: soft_low_offset
  hold_s: [4.0, 7.0]
  forms: [paper_note, chat_window, quadrant_grid, cta]
  # 形态必须和内容对得上：纸片卡配"手工/草稿"，对话窗配"AI 交互"，四象限配"对比分级"

split_screen:
  ratio: [0.3, 0.7]              # 3:7 分屏时，字幕竖位会掉到 60–74%H（不是 86%）
  band_by_layout:
    full_bleed_center: 0.86
    split_3_7: [0.60, 0.74]
    half_half: [0.35, 0.41]
  brand_strip_h: [0.08, 0.10]    # 底部品牌条 92–100%

annotation:
  color: "#D4231F"               # 红标注/尺寸线
  must_render_after_grade: true  # **铁律**：标注层必须在调色之后叠加，否则被一起抽灰
  forms: [double_arrow, dashed_align, dimension_text]

scale_axis:
  position_h: [0.05, 0.10]       # 刻度轴在顶部 5–10%，不是中部
  ticks: [4, 6]                  # 4–6 个刻度
  cursor: portrait_circle        # 游标是圆形头像，不是指针
  sync_with_content: required    # 刻度必须与讲到的地方同步，不同步立刻露馅

tempo:
  shot_median_s: [2.2, 4.1]      # 卡面占比高时 4.1s 就会闷
  sfx_density_per_min: [0.0, 8.5]

applies_to:
  - 方法论、测评、清单、对比、改造过程
  - 内容本身有"结构"可以画出来（步骤、象限、尺寸、进程）
  - 单条素材能撑起一张卡（不是一堆碎镜头）

fails_on:
  - 卡面占片长过半 + 4.1s 中位 → 节奏闷死
  - 标注层在调色之前 → 红色被抽成灰粉（买鞋那片明确记了这条）
  - 刻度轴/进度条与内容不同步 → 观众立刻发现是贴上去的
  - 83s 长镜靠手工动作撑：素材撑不住就是死气
