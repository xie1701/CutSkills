# 包装模板 D · 双语双行（pack-bilingual）
#
# 两行同屏：中文给语义，第二行给扫读。第二行的字高是中文的 0.40–0.45 倍，这个比例在
# 四支来源片上高度一致——比字色更稳定，是这一族真正的签名。
#
# 来源片（按"块高"分成紧凑档与宽松档，两档差 5 倍）：
#   别只盯着赛道      中文 0.031H 宋体 @0.618–0.649H + 英文衬线 0.013H @0.666–0.679H · 行距 0.017H · 块高 0.028H
#   AI剪辑12个行业模板 中文 0.027H @70.5–73.1% + 英文 0.010H @74.0–75.0% · 单屏 2 行 · 每条 10–16 字
#   剪辑skill全流程   中文 0.033H @0.874–0.907H + 英文 0.009H · 行距 0.026H
#   大师与红利        每行 6–8%H · 块总高 14–15%H · 85–95%H · 中文白 / 英文黄

name: pack-bilingual
label: 双语双行（中文 + 第二行）
family: D

canvas:
  aspect: [9:16, 16:9]
  fps: [24, 30]

subtitle:
  lines_per_screen: 2
  tier: [compact, loose]        # 紧凑档 0.028H 块高；宽松档 0.14–0.15H 块高
  compact:
    cn_glyph_h: [0.027, 0.033]
    second_glyph_h: [0.009, 0.013]
    row_gap_h: [0.017, 0.026]
    block_total_h: [0.028, 0.042]
    band_center_h: [0.63, 0.91]
    chars_per_line_cn: [8, 16]
  loose:
    cn_glyph_h: [0.06, 0.08]
    block_total_h: [0.14, 0.15]
    band_center_h: [0.85, 0.95]
    chars_per_line_cn: [7, 10]
  ratio_second_to_cn: [0.40, 0.45]   # 四支片一致，最硬的跨片常量
  color_scheme:
    assist:                      # 第二行只做辅助
      cn: "#FFFFFF"
      second: "#FFFFFF"
    emphasis:                    # 第二行承担"标注/翻译"功能，用色拉开
      cn: "#FFFFFF"
      second: "#FFCC00"
  stroke:
    color: "#000000"
    ratio_of_glyph: [0.10, 0.12]
  safe_bottom_h: 0.05
  entry: hard_cut

applies_to:
  - 面向双语受众、或需要"看起来专业"的知识型内容
  - 内容有可翻译的实质（术语、金句、观点），第二行不是硬凑
  - 横屏为主（4 支来源片里 3 支横屏）

fails_on:
  - 宽松档永久让出 14–15% 画面；竖屏贴 85–95% 会被平台底栏吃
  - 第二行硬翻成英文而没有实质内容时，观众第一眼就看出是装饰
  - 中文单条超过 16 字：英文行必然换行，两行块高失控
