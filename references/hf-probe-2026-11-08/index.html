<!doctype html>
<html lang="zh" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>hf-test</title>
<style>
@font-face { font-family: "SC Sub"; src: url("assets/fonts/NotoSansSC-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "SC Black"; src: url("assets/fonts/NotoSansSC-Black.ttf"); font-weight: 900; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
#root { position:relative; width:100%; height:100%; }
.clip { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#grade { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 42%, rgba(30,18,8,0.55) 100%); }
.cap { position:absolute; left:0; right:0; top:69.20%; display:flex; justify-content:center; }
.cap span { font-family:"SC Sub", sans-serif; font-weight:600; font-size:54px; color:#fff;
  letter-spacing:0.01em; text-shadow:0 3px 10px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.9); }
.kw { position:absolute; left:0; right:0; top:46%; display:flex; justify-content:center; }
.kw span { font-family:"SC Black", sans-serif; font-weight:900; font-size:188px; line-height:1;
  background:linear-gradient(180deg,#FFE53B 0%,#FFB000 100%); -webkit-background-clip:text;
  color:transparent; -webkit-text-stroke:0; filter:drop-shadow(0 8px 24px rgba(0,0,0,0.55)); }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="14.42">
    <video id="v1" class="clip" src="assets/clips/s1.mp4" data-start="0.0" data-duration="6.72" data-media-start="0" data-track-index="0" playsinline data-has-audio="true"></video>
    <video id="v2" class="clip" src="assets/clips/s2.mp4" data-start="6.72" data-duration="2.82" data-media-start="0" data-track-index="0" playsinline data-has-audio="true"></video>
    <video id="v3" class="clip" src="assets/clips/s3.mp4" data-start="9.54" data-duration="4.88" data-media-start="0" data-track-index="0" playsinline data-has-audio="true"></video>
    <div id="grade"></div>
    <div id="kwlayer">
      <div class="clip kw" id="kw" data-start="3.604" data-duration="1.3"><span id="kwt">不是非黑即白</span></div>
    </div>
    <div id="caplayer">
      <div id="cap-01" class="clip cap" data-start="0.06" data-duration="3.664"><span>事情不是这么简单的</span></div>
      <div id="cap-02" class="clip cap" data-start="3.724" data-duration="2.036"><span>去非黑即白</span></div>
      <div id="cap-03" class="clip cap" data-start="5.76" data-duration="0.96"><span>我是这样看的</span></div>
      <div id="cap-04" class="clip cap" data-start="6.84" data-duration="2.7"><span>进口的一定好就对吧</span></div>
      <div id="cap-05" class="clip cap" data-start="9.54" data-duration="2.16"><span>他就觉得差不多</span></div>
      <div id="cap-06" class="clip cap" data-start="11.7" data-duration="2.078"><span>或者说觉得国产的也</span></div>
      <div id="cap-07" class="clip cap" data-start="13.778" data-duration="0.462"><span>不错</span></div>
    </div>
  </div>
<script src="assets/gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
// 每条字幕：从下 14px 滑上来 + 淡入，60ms 内完成——ffmpeg 那条链做不到的曲线
document.querySelectorAll(".cap").forEach((c) => {
  const t = parseFloat(c.dataset.start);
  tl.fromTo(c.querySelector("span"),
    { y: 14, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.16, ease: "power3.out" }, t);
});
if (document.getElementById("kwt")) {
  const box = document.getElementById("kw");
  const t = parseFloat(box.dataset.start);
  tl.fromTo("#kwt",
    { scale: 0.72, opacity: 0, rotate: -3 },
    { scale: 1, opacity: 1, rotate: 0, duration: 0.34, ease: "back.out(2.2)" }, t);
  tl.to("#kwt", { opacity: 0, duration: 0.18, ease: "power1.in" }, t + parseFloat(box.dataset.duration) - 0.18);
}
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
