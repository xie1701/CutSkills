# 包装包 · 五子系统（subtitle / mg / fx / frame / look）+ tokens
# 换包装只换这个文件，不许动 plans/ 与 timeline 的时间。
name: P2-paper
label: 纸感 · 双语双行
canvas:
  width: 1080
  height: 1920
  fps: 30
grade: paper_neutral
subtitle:
  font: NotoSerifSC-Regular
  size_px: 72
  weight: ExtraBold
  color: '#1F1B16'
  # 深墨字压在暗画面上实测读不出来（字幕带 p98 152 / 字 30）→ 纸感改奶白字
  light_text: true
  shadow: 0 1px 0 rgba(255,255,255,.6)
  center_y_px: 1294
  safe_bottom_px: 300
  max_chars_per_line: 10
  hold_min_s: 0.8
  hold_max_s: 3.2
  density_per_min:
  - 45
  - 58
  entry: hard_cut
  colorize_emphasis: false
  # 深墨字压在暗画面上读不出来 → 垫一条纸底（实测字幕带 p98 152 / 字 30）
  plate: true
emphasis:
  font: NotoSerifSC-Bold
  grammars:
  - big_keyword
  - strikethrough
  - quote
  keyword_color: '#B4552D'
  negation_color: '#8C2F1E'
  big_keyword_px:
  - 133
  - 304
  fit_width: 0.7
  top_h: 0.3
  max_one_action_per_caption: true
shots:
  talking_median_s: 2.4
  max_single_shot_s: 12
  medium_change_within_s: 40
sfx:
  density_per_min:
  - 3
  - 7
  placement: on_cut_only
  tolerance_frames: 2
  bgm: none_or_very_low
audio:
  loudness_lufs: -14
  true_peak_dbtp: -1
  cut_fade_ms: 30
  duck_db: 12
card:
  bottom_edge_max_px: 1080
  mg_top_h: 0.21            # MG 卡上沿（画幅高度比例）
tokens:
  palette:
    ground: '#F2EDE3'
    ink: '#1F1B16'
    accent: '#B4552D'
    accent2: '#4A6B57'
  # 卡面底板 / 遮罩 / 描边 / 字色（T-018）：从 render_hf.py 里抽出来，一个值不改——
  # 这套包今天的样片长什么样，抽完之后还得一模一样。
  surface:
    plate: 'rgba(10,13,19,.76)'
    plate_term: 'rgba(12,15,21,.84)'
    border: 'rgba(255,255,255,.16)'
    border_term: 'rgba(255,255,255,.14)'
    scrim: 'radial-gradient(76% 56% at 50% 42%, rgba(0,0,0,.90) 0%, rgba(0,0,0,.76) 46%, rgba(0,0,0,.38) 82%, rgba(0,0,0,.12) 100%)'
    ink: '#FFFFFF'          # 纸底是浅的，卡面板却是深的：卡面字仍用白，不跟 palette.ink 走
    blur_ness: 0
    # T-019 复核②：纸语域的板子重量比暖炭灰轻一档（外投影峰值 .34），扩散同宽。
    # 卡面板 box-shadow 与底板（.mgplate）自模糊外投影共用这一条。
    shadow: 'inset 0 1px 0 rgba(255,255,255,.16), 0 24px 60px rgba(6,8,12,.34), 0 6px 18px rgba(6,8,12,.20)'
  type:
    display: NotoSerifSC-Bold
    body: NotoSerifSC-Regular
  radius: 6
  stroke: 2
  shadow: none
subtitle_system:
  id: bilingual
  desc: 中文主行 72px + 英文小字 34px，两行固定高度
  en_size_px: 34
  en_color: 'rgba(246,241,231,0.90)'  # 跟着 light_text 走，深灰英文在暗画面上读不出来
mg:
  # MG = 代码画的动效卡。选哪张由**内容形态**决定，不由风格决定；
  # 风格只决定它长什么样（色、字、圆角、描边全走 tokens）。
  library:
  - keyword-big      # 一句话结论 / 强断言（现有大字，含脑后模式）
  - stat             # 数字、规模、时长、比例 —— 必须有出处或标示意
  - steps            # 两到三步的流程、并列条件
  - versus           # 两个方案 / 两个时段 / 两边的对比
  - term             # 名词解释（行话、方言词、品类词）
  rules:
  - 一批片子里同一个卡型不重复超过 2 次
  - 每条片至少一张内容专属卡：有数字就用 stat，有对比就用 versus，有流程就用 steps
  - MG 卡不许压字幕带，不许压人脸
  - 卡上的话必须是台词里的原词，不许另写宣传语

fx:
- page_turn
- note_drop
- hard_cut
frame:
  id: split
  desc: 图文双栏：左画面右卡（竖屏下改为上画面下卡）
look_notes: 纸感：米白纸底、深墨字、宋体、双语双行。同一条口播换成「一页纸」的气质，适合解释型、资料型内容。
