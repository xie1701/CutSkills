# 包装包 · 五子系统（subtitle / mg / fx / frame / look）+ tokens
# 换包装只换这个文件，不许动 plans/ 与 timeline 的时间。
name: P3-dark
label: 暗调 · 大字即字幕
canvas:
  width: 1080
  height: 1920
  fps: 30
grade: dark_punch
subtitle:
  font: NotoSansSC-SemiBold
  size_px: 88
  weight: ExtraBold
  color: '#F5F7FA'
  shadow: 0 3px 8px rgba(0,0,0,.75), 0 1px 2px rgba(0,0,0,.9)
  center_y_px: 1294
  safe_bottom_px: 300
  max_chars_per_line: 10
  hold_min_s: 0.8
  hold_max_s: 3.2
  density_per_min:
  - 45
  - 58
  entry: hard_cut
  colorize_emphasis: false
emphasis:
  font: NotoSansSC-Black
  grammars:
  - big_keyword
  - strikethrough
  - quote
  keyword_color: '#39D0C4'
  negation_color: '#FF6B4A'
  big_keyword_px:
  - 133
  - 304
  fit_width: 0.7
  top_h: 0.3
  max_one_action_per_caption: true
shots:
  talking_median_s: 2.4
  max_single_shot_s: 12
  medium_change_within_s: 40
sfx:
  density_per_min:
  - 3
  - 7
  placement: on_cut_only
  tolerance_frames: 2
  bgm: none_or_very_low
audio:
  loudness_lufs: -14
  true_peak_dbtp: -1
  cut_fade_ms: 30
  duck_db: 12
card:
  bottom_edge_max_px: 1080
  mg_top_h: 0.21            # MG 卡上沿（画幅高度比例）
tokens:
  palette:
    ground: '#0B0C0E'
    ink: '#F5F7FA'
    accent: '#39D0C4'
    accent2: '#FF6B4A'
  # 卡面底板 / 遮罩 / 描边 / 字色（T-018）：**深色科技语域就归这套包**——
  # 原来写死在 render_hf.py 里的冷黑蓝底板与 90% 黑遮罩，原封不动接在这里。
  # 其它包想用它们得自己写，写不出就是「语域选错了」，而不是默认值。
  surface:
    plate: 'rgba(10,13,19,.76)'
    plate_term: 'rgba(12,15,21,.84)'
    border: 'rgba(255,255,255,.16)'
    border_term: 'rgba(255,255,255,.14)'
    scrim: 'radial-gradient(76% 56% at 50% 42%, rgba(0,0,0,.90) 0%, rgba(0,0,0,.76) 46%, rgba(0,0,0,.38) 82%, rgba(0,0,0,.12) 100%)'
    ink: '#FFFFFF'
    blur_ness: 0
    # T-019 复核②：黑语域里投影不靠色温而是靠**深度**（峰值 .46，扩得最宽 70px），
    # 否则黑底上的黑板看不出“压在上面”。卡面板 box-shadow 与底板自模糊外投影共用。
    shadow: 'inset 0 1px 0 rgba(255,255,255,.14), 0 28px 70px rgba(0,0,0,.46), 0 8px 22px rgba(0,0,0,.28)'
  type:
    display: NotoSansSC-Black
    body: NotoSansSC-Regular
  radius: 2
  stroke: 1
  shadow: glow
subtitle_system:
  id: none
  desc: 无字幕层：大字即字幕，每屏 ≤10 字、单排、停留 ≥1.2s
  max_chars: 10
  hold_min_s: 1.2
mg:
  # MG = 代码画的动效卡。选哪张由**内容形态**决定，不由风格决定；
  # 风格只决定它长什么样（色、字、圆角、描边全走 tokens）。
  library:
  - keyword-big      # 一句话结论 / 强断言（现有大字，含脑后模式）
  - stat             # 数字、规模、时长、比例 —— 必须有出处或标示意
  - steps            # 两到三步的流程、并列条件
  - versus           # 两个方案 / 两个时段 / 两边的对比
  - term             # 名词解释（行话、方言词、品类词）
  rules:
  - 一批片子里同一个卡型不重复超过 2 次
  - 每条片至少一张内容专属卡：有数字就用 stat，有对比就用 versus，有流程就用 steps
  - MG 卡不许压字幕带，不许压人脸
  - 卡上的话必须是台词里的原词，不许另写宣传语

fx:
- morph_carry
- sweep
- particles
frame:
  id: full-pip
  desc: 全屏代码画面，人物右下 PiP（B 轴默认版式）
look_notes: 暗调：近黑底、单强调色、无字幕层（大字即字幕）。每屏 ≤10 字、单排、停留 ≥1.2s，适合强观点、短句节奏。
