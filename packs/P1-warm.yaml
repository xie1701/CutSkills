# 包装包 · 五子系统（subtitle / mg / fx / frame / look）+ tokens
# 换包装只换这个文件，不许动 plans/ 与 timeline 的时间。
name: P1-warm
label: 暖实拍（现行）
canvas:
  width: 1080
  height: 1920
  fps: 30
grade: warm_high_sat
subtitle:
  font: 得意黑
  size_px: 80
  weight: ExtraBold
  color: '#FFFFFF'
  shadow: 0 3px 8px rgba(0,0,0,.75), 0 1px 2px rgba(0,0,0,.9)
  stroke: '2px rgba(0,0,0,0.35)'     # 白字压在浅色食物/木纹镜头上会被吃掉
  center_y_px: 1294
  safe_bottom_px: 300
  max_chars_per_line: 10
  hold_min_s: 0.8
  hold_max_s: 3.2
  density_per_min:
  - 45
  - 58
  entry: hard_cut
  colorize_emphasis: false
emphasis:
  font: NotoSansSC-Black
  grammars:
  - big_keyword
  - strikethrough
  - quote
  keyword_color: '#F6EB34'
  negation_color: '#C1121F'
  big_keyword_px:
  - 133
  - 304
  fit_width: 0.7
  top_h: 0.3
  # 大字隔离层（T-045）：只有 timeline 里 `card.isolate: true` 的那张才画。
  # 压在杂乱背景（工地工具/人身上）的大字靠 text-shadow 不够——投影只舔笔画边，
  # 隔不开一整块高频背景；一层跟着字框走的柔化压暗才把「字底下的那几行像素」压下去。
  # 浓度是「字读不读得出」的账（判据 ΔL ≥ 12，见 scripts/check_keyword_text.py），
  # 不是装饰参数。
  isolate:
    fill: 'rgba(18,15,12,.32)'    # 暖炭黑，跟着本包的语域，不用纯黑
    feather_px: 80                # 柔化半径：边界不许是硬边（硬边就成一块卡片了）
    pad_x: 0.05                   # 横向外扩（×W）
    pad_y: 0.42                   # 纵向外扩（×字高）
    radius_px: 26
  max_one_action_per_caption: true
shots:
  talking_median_s: 2.4
  max_single_shot_s: 12
  medium_change_within_s: 40
sfx:
  density_per_min:
  - 3
  - 7
  placement: on_cut_only
  tolerance_frames: 2
  bgm: none_or_very_low
audio:
  loudness_lufs: -14
  true_peak_dbtp: -1
  cut_fade_ms: 30
  duck_db: 12
card:
  bottom_edge_max_px: 1080
  mg_top_h: 0.21            # MG 卡上沿（画幅高度比例）
tokens:
  palette:
    ground: '#1A1410'
    ink: '#FFFFFF'
    accent: '#F6EB34'
    accent2: '#C1121F'
  # 卡面底板 / 遮罩 / 描边 / 字色（T-018）：以前写死在 render_hf.py 的 CSS 里，
  # 换包换不掉。现在归包管——工程手艺语域用暖炭灰，不是冷黑蓝弹窗底。
  # 改这一块只改「卡长什么样」，切点、时长一个不动。
  surface:
    # 卡面板底＝**纵向光线**，不是一块平涂色（T-042）：
    #   0–2.5%  顶部一道窄亮带（受上方光源：**换色不换浓度**——
    #           亮带用更亮的颜色 + 同一档 alpha，所以在暗底和亮底上都是「更亮」，
    #           而「抬高 alpha」只在暗底上更亮、在亮底上反而更暗）
    #   7%      回落到面板本色
    #   16%     本色稳定段（字的落点基本在这以下）
    #   62%     中部再落一档（光从上往下衰减）
    #   100%    底部略沉（面板下缘背光）
    # 中段不透明度从 .78 降到 .70：背景纹理透得出来一点，但字仍然读得出
    # （scripts/test_panel_light.py 逐档量「字 vs 紧邻底板」ΔL，门槛 ≥12）。
    plate: 'linear-gradient(180deg, rgba(110,99,88,.78) 0%, rgba(74,66,58,.78) 2.5%, rgba(44,40,35,.77) 7%, rgba(30,27,24,.73) 16%, rgba(30,27,24,.70) 62%, rgba(18,15,13,.80) 100%)'
    plate_term: 'linear-gradient(180deg, rgba(110,99,88,.82) 0%, rgba(74,66,58,.82) 2.5%, rgba(44,40,35,.81) 7%, rgba(30,27,24,.77) 16%, rgba(30,27,24,.74) 62%, rgba(18,15,13,.84) 100%)'
    # 底板（.mgplate > .mp-surf）那一层光线：只加光，不额外压暗——
    # 顶部窄亮带 + 底部轻沉，叠在 scrim 之上，让整块板有「受光面」。
    light: 'linear-gradient(180deg, rgba(255,243,228,.16) 0%, rgba(255,243,228,.06) 2.5%, rgba(0,0,0,0) 12%, rgba(0,0,0,.10) 100%)'
    border: 'rgba(255,241,224,.16)'        # 描边走暖白，不走中性白
    border_term: 'rgba(255,241,224,.14)'
    # 全屏暗场只换色温、不换浓度（.90/.76/.38/.12 与旧值一致）：
    # 浓度是「字读不读得出来」的账，换语域没资格动它
    scrim: 'radial-gradient(76% 56% at 50% 42%, rgba(20,18,16,.90) 0%, rgba(20,18,16,.76) 46%, rgba(20,18,16,.38) 82%, rgba(20,18,16,.12) 100%)'
    ink: '#FFFFFF'                         # 卡面字色：暖炭灰底上仍用纯白（对比度优先）
    blur_ness: 0                           # 0 = 不磨砂，现有样片像素不动
    # T-019 复核②：一块板压在画面上，没投影就是贴纸。柔和大半径 + 低不透明度（外投影峰值 .38）。
    # 两个用途共用这一条：卡面板的 box-shadow，与底板（.mgplate）自己那层自模糊外投影
    # （取其中模糊最大的那条，见 render_hf.plate_glow）。
    # T-042：内侧 1px 倒角从这条里拆到 `edge`（顶光 / 底暗各一条），shadow 只剩外投影，
    # 免得 plate_glow 与 box-shadow 抢同一个字段、也免得倒角被外投影的参数带着漂。
    shadow: '0 26px 64px rgba(18,12,6,.38), 0 8px 20px rgba(18,12,6,.22)'
    # 内侧倒角：1px 顶光（光从上面打下来）+ 1px 底暗（下缘背光）。
    # 面板有这两条，边界才读得出「厚度」而不是「一块色」。[顶, 底]
    edge:
    - 'rgba(255,241,224,.34)'
    - 'rgba(0,0,0,.34)'
  type:
    display: NotoSansSC-Black
    body: NotoSansSC-SemiBold
  radius: 18
  stroke: 0
  shadow: soft-down
mg:
  # MG = 代码画的动效卡。选哪张由**内容形态**决定，不由风格决定；
  # 风格只决定它长什么样（色、字、圆角、描边全走 tokens）。
  library:
  - keyword-big      # 一句话结论 / 强断言（现有大字，含脑后模式）
  - stat             # 数字、规模、时长、比例 —— 必须有出处或标示意
  - steps            # 两到三步的流程、并列条件
  - versus           # 两个方案 / 两个时段 / 两边的对比
  - term             # 名词解释（行话、方言词、品类词）
  rules:
  - 一批片子里同一个卡型不重复超过 2 次
  - 每条片至少一张内容专属卡：有数字就用 stat，有对比就用 versus，有流程就用 steps
  - MG 卡不许压字幕带，不许压人脸
  - 卡上的话必须是台词里的原词，不许另写宣传语

fx:
- hard_cut
- nudge_in
- cover_fg
frame:
  id: full
  desc: 全屏口播，卡在上三分之一
subtitle_system:
  id: single-line
  desc: 单行 80px、无标点、硬切
look_notes: 现行基线：黑底暖金、思源黑体、单行白字幕、大字在脑后。取自 20 支参考片的中位观感——暖、实、不抢话。
