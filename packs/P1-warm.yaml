# 包装包 · 五子系统（subtitle / mg / fx / frame / look）+ tokens
# 换包装只换这个文件，不许动 plans/ 与 timeline 的时间。
name: P1-warm
label: 暖实拍（现行）
canvas:
  width: 1080
  height: 1920
  fps: 30
grade: warm_high_sat
subtitle:
  font: NotoSansSC-SemiBold
  size_px: 80
  weight: ExtraBold
  color: '#FFFFFF'
  shadow: 0 3px 8px rgba(0,0,0,.75), 0 1px 2px rgba(0,0,0,.9)
  stroke: '2px rgba(0,0,0,0.35)'     # 白字压在浅色食物/木纹镜头上会被吃掉
  center_y_px: 1294
  safe_bottom_px: 300
  max_chars_per_line: 10
  hold_min_s: 0.8
  hold_max_s: 3.2
  density_per_min:
  - 45
  - 58
  entry: hard_cut
  colorize_emphasis: false
emphasis:
  font: NotoSansSC-Black
  grammars:
  - big_keyword
  - strikethrough
  - quote
  keyword_color: '#F6EB34'
  negation_color: '#C1121F'
  big_keyword_px:
  - 133
  - 304
  fit_width: 0.7
  top_h: 0.3
  max_one_action_per_caption: true
shots:
  talking_median_s: 2.4
  max_single_shot_s: 12
  medium_change_within_s: 40
sfx:
  density_per_min:
  - 3
  - 7
  placement: on_cut_only
  tolerance_frames: 2
  bgm: none_or_very_low
audio:
  loudness_lufs: -14
  true_peak_dbtp: -1
  cut_fade_ms: 30
  duck_db: 12
card:
  bottom_edge_max_px: 1080
  mg_top_h: 0.21            # MG 卡上沿（画幅高度比例）
tokens:
  palette:
    ground: '#1A1410'
    ink: '#FFFFFF'
    accent: '#F6EB34'
    accent2: '#C1121F'
  type:
    display: NotoSansSC-Black
    body: NotoSansSC-SemiBold
  radius: 18
  stroke: 0
  shadow: soft-down
mg:
  # MG = 代码画的动效卡。选哪张由**内容形态**决定，不由风格决定；
  # 风格只决定它长什么样（色、字、圆角、描边全走 tokens）。
  library:
  - keyword-big      # 一句话结论 / 强断言（现有大字，含脑后模式）
  - stat             # 数字、规模、时长、比例 —— 必须有出处或标示意
  - steps            # 两到三步的流程、并列条件
  - versus           # 两个方案 / 两个时段 / 两边的对比
  - term             # 名词解释（行话、方言词、品类词）
  rules:
  - 一批片子里同一个卡型不重复超过 2 次
  - 每条片至少一张内容专属卡：有数字就用 stat，有对比就用 versus，有流程就用 steps
  - MG 卡不许压字幕带，不许压人脸
  - 卡上的话必须是台词里的原词，不许另写宣传语

fx:
- hard_cut
- nudge_in
- cover_fg
frame:
  id: full
  desc: 全屏口播，卡在上三分之一
subtitle_system:
  id: single-line
  desc: 单行 80px、无标点、硬切
look_notes: 现行基线：黑底暖金、思源黑体、单行白字幕、大字在脑后。取自 20 支参考片的中位观感——暖、实、不抢话。
